apiVersion: apps/v1
kind: Deployment
metadata:
  name: guardian-gateway
  namespace: finance-demo
  labels:
    app: guardian-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: guardian-gateway
  template:
    metadata:
      labels:
        app: guardian-gateway
    spec:
      imagePullSecrets:
        - name: vcr-cred
      containers:
        - name: guardian-gateway
          # CI thay :latest bằng commit SHA (xem README).
          image: vcr.vngcloud.vn/114544-ea-hackathon/guardian-gateway:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            # Địa chỉ 5 service domain, dùng chung ConfigMap với chính các service
            # đó nên không có chỗ nào khai báo trùng.
            - configMapRef:
                name: guardian-endpoints
          env:
            # Đặt "false" để chạy hoàn toàn bằng dữ liệu tạm trong catalog.py —
            # hữu ích khi trình bày offline hoặc khi domain đang bảo trì.
            - name: DOMAIN_ENABLED
              value: "true"
            # Khách hàng của kịch bản demo: người cao tuổi trong fraud case F01
            # (giả danh công an), đúng câu chuyện màn Scam Shield kể.
            - name: DEMO_CUSTOMER_ID
              value: "100008"
            - name: DEMO_FRAUD_CASE_ID
              value: "F01"
            # Màn "Đang phân tích giao dịch..." bên FE dài đúng bằng thời gian
            # chờ API. Engine thật đã mất một khoảng; giảm còn 800ms để tổng thời
            # gian vẫn giống nhịp cũ mà không kéo dài thêm.
            - name: RISK_ASSESS_DELAY_MS
              value: "800"
            # agent-service nằm ở namespace khác nên phải dùng tên đầy đủ.
            - name: AGENT_SERVICE_URL
              value: "http://agent-service.agent-platform.svc.cluster.local:8080"
            - name: AGENT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: guardian-agent
                  key: API_KEY
            # Agent "Trợ lý Tài chính Guardian" trong nền tảng agent-platform:
            # provider GreenNode MaaS (model z-ai/glm-5.2-hackathon) + 3 tool trỏ
            # về chính gateway (customer-profile, monthly-overview,
            # quarterly-spending). Có id này, gateway.agent_answer() gọi
            # POST /v1/agents/{id}/runs và chat dùng LLM thật thay cho kịch bản.
            - name: AGENT_ID
              # MSB Copilot Agent trong DB agent_platform dùng chung máy chủ với
              # 5 service domain (49.213.71.208). Bộ agent cũ nằm ở Postgres
              # trong cluster, đã ngừng dùng từ 17/09.
              value: "01a0a9fa-081c-7465-b681-bd8dc90834ec"
            # Agent Scam Shield — kiểm tra dấu hiệu lừa đảo cho stk mới. Điền sau
            # khi tạo agent thứ hai; trống thì precheck rơi về verdict suy từ tín hiệu.
            - name: SCAMSHIELD_AGENT_ID
              value: ""
            # Agent thứ ba: chỉ trích ý định chuyển tiền từ một câu, KHÔNG gắn
            # công cụ nào nên một lượt chỉ 1-5 giây. Agent Copilot mang 11 công
            # cụ, một lượt 10-20 giây — quá chậm cho màn giao dịch.
            - name: CHATBANKING_AGENT_ID
              value: "01a0b01a-d096-75c2-b1b4-65ec422d4c29"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: guardian-gateway
  namespace: finance-demo
  labels:
    app: guardian-gateway
spec:
  # NodePort chứ không ClusterIP: ALB của VNG định tuyến tới node port, controller
  # từ chối backend ClusterIP ("service type must be either 'NodePort' or
  # 'LoadBalancer'"). Đổi lại ClusterIP là ingress guardian ngừng hoạt động.
  type: NodePort
  selector:
    app: guardian-gateway
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
